name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Loyiha papkasini topish
        id: p
        run: |
          F=$(find . -name pubspec.yaml -not -path '*/build/*' -not -path '*/.dart_tool/*' | head -1)
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android papkasini yaratish
        working-directory: ${{ steps.p.outputs.dir }}
        run: flutter create --platforms=android --org uz.topik --project-name topik_app .

      - name: Ruxsatlar va nom
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n    <application#' $M
          sed -i 's#android:label="topik_app"#android:label="TOPIK 한국"#' $M

      - name: Paketlar
        working-directory: ${{ steps.p.outputs.dir }}
        run: flutter pub get

      - name: APK yig'ish
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          flutter build apk --release --config-only
          (cd android && ./gradlew assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease)
          
          cp build/app/outputs/flutter-apk/app-release.apk TOPIK.apk

      - name: Artifact sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: topik-apk
          path: ${{ steps.p.outputs.dir }}/TOPIK.apk

      - name: Releases bo'limiga qo'yish (to'g'ridan-to'g'ri yuklab olish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TOPIK 한국 v${{ github.run_number }}
          files: ${{ steps.p.outputs.dir }}/TOPIK.apk
